description: Infineon TC3x Port Module

compatible: "infineon,tc3x-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  irq-sources:
    type: array
    description: |
      Optional list of GPIO IRQ sources tied to specific pins on
      this port. Each entry is a packed encoding produced by the
      AURIX_GPIO_IRQ_TIM() macro from the SoC's gpio_irq.h header
      (pin, GTM TIM unit, channel, mux). Entries are paired in
      order with the node's interrupts property: irq-sources[i]
      uses interrupts[i].

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
