description: Synopsys 10BASE-T1S PHY
compatible: "snps,t1s-phy"
include: phy.yaml

properties:
  reg:
    required: true
    description: PHY address

  plca-enable:
    type: boolean
    description: Enable or disable PLCA support
  disable-physical-collision:
    type: boolean
    description: Set PCS control PCD bit to disable physical collision detection
  plca-buf-depth:
    type: int
    description: PLCA receive buffer depth (PVBD field)
  plca-node-id:
    type: int
    description: Specify the PLCA node ID number
  plca-node-count:
    type: int
    description: Specify the PLCA node count
  plca-burst-count:
    type: int
    description: Specify the PLCA burst count
  plca-burst-timer:
    type: int
    description: Specify the PLCA burst timer value
  plca-to-timer:
    type: int
    description: Specify the PLCA to timer value
