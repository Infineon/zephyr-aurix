description: Realtek RTL8201F Ethernet PHY device

compatible: "realtek,rtl8201f"

include: ethernet-phy-common.yaml

properties:
  reset-gpios:
    type: phandle-array
    description: GPIO connected to PHY reset signal pin. Reset is active low.
  int-gpios:
    type: phandle-array
    description: GPIO for interrupt signal indicating PHY state change.
  default-speeds:
    default: ["10BASE Half-Duplex", "10BASE Full-Duplex", "100BASE Half-Duplex",
              "100BASE Full-Duplex"]
  eee-enable:
    type: boolean
    description: Enable Energy Efficient Ethernet (EEE) support.
