description: Infineon Aurix QSPI controller (Queued SPI)

compatible: "infineon,aurix-qspi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  interrupt-names:
    required: true

  infineon,loopback:
    type: boolean
    description: |
      Enable QSPI internal loopback (GLOBALCON.LB=1) and disable all SLSO
      outputs (SSOC.OEN=0). Used to validate the controller without driving
      any on-board slave. For bring-up and self-test only.

  infineon,sclk-frequency:
    type: int
    default: 1000000
    description: |
      Target SCLK frequency in Hz produced by ECON[0]/GLOBALCON.TQ when no
      runtime spi_config.frequency is supplied. Defaults to 1 MHz.
