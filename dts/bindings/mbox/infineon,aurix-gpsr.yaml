description: Mbox implementation for the Aurix SoCs based on GPSR IRQs

compatible: infineon,aurix-gpsr

include: [base.yaml, mailbox-controller.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  rx-channels:
    type: array

mbox-cells:
  - channel
